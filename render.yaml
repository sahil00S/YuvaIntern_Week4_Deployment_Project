services:
  - type: web
    name: yuva-week4-wine-classifier-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m ml.train
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
